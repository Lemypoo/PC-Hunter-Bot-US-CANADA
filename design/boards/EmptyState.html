<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  
</head>
<body>


  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #141413; --panel: #1d1d1b; --panel2: #262523; --line: #33322e;
      --text: #faf9f5; --muted: #b0aea5; --faint: #7c7a72;
      --accent: #d97757; --accent-bright: #e89070;
      --fs: 14px; --fs-head: 16px;
      --ui: "Poppins", Arial, Helvetica, sans-serif;
      --prose: "Lora", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs)/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent-bright); }
    button { font: 500 var(--fs)/1.4 var(--ui); color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a1008; font-weight: 600; }
    button.ghost { background: transparent; }
    input { font: 400 var(--fs)/1.5 var(--ui); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; }
    input::placeholder { color: var(--faint); }

    .top { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand { font-weight: 600; font-size: var(--fs-head); display: flex; align-items: center; gap: 9px; white-space: nowrap; letter-spacing: -0.01em; }
    .brand .logo { flex: none; color: var(--accent); }
    .status { color: var(--muted); flex: 1; }
    .actions { display: flex; gap: 8px; }

    main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; }
    .addbar { display: flex; gap: 10px; margin-bottom: 18px; }
    .addbar button { white-space: nowrap; padding: 0 20px; }

    .empty { text-align: center; color: var(--muted); padding: 96px 20px; font-family: var(--prose); line-height: 1.6; }
    .empty .big { font-size: var(--fs-head); color: var(--text); margin-bottom: 10px; font-family: var(--ui); font-weight: 600; letter-spacing: -0.01em; }
    .empty .sub { max-width: 540px; margin: 0 auto; }
    .foot { max-width: 1400px; margin: 0 auto; padding: 0 20px 28px; color: var(--muted); display: flex; gap: 18px; font-family: var(--prose); }
    .foot a { text-decoration: underline; }
  </style>


<div style="background: #141413; min-height: 640px; display: flex; flex-direction: column">

  <div class="top">
    <div class="brand">
      <svg class="logo" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="10" cy="10" r="2" fill="currentColor"></circle><path d="M10 1v4M10 15v4M1 10h4M15 10h4" stroke="currentColor" stroke-width="2"></path></svg>
      Item Hunter
    </div>
    <div class="status">No check yet · every 15 min · via msedge</div>
    <div class="actions">
      <button class="primary">Check all now</button>
      <button class="ghost">Settings</button>
    </div>
  </div>

  <main style="flex: 1">
    <div class="addbar">
      <input value="" placeholder="Part to hunt, for example 9950X3D, RTX 5080, 9800X3D">
      <button class="primary">Hunt it</button>
    </div>

    <div class="empty">
      <div class="big">Nothing being hunted yet.</div>
      <div class="sub">Type a part above. Each one gets a card here with the cheapest in-stock listing from every store, and drops land in the feed.</div>
    </div>
  </main>

  <div class="foot">
    <span>Runs on this computer. Only in-stock listings are shown.</span>
    <a>Privacy</a>
    <a>Terms</a>
  </div>

</div>



</body>
</html>
